name: Resolve WooCommerce checksum

on:
  push:
    branches: [fix/full-audit-product-defects]
    paths:
      - .github/workflows/resolve-woocommerce-checksum.yml

permissions:
  contents: write

jobs:
  checksum:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out checksum branch
        uses: actions/checkout@v7
        with:
          ref: fix/full-audit-product-defects

      - name: Download official pinned WooCommerce package
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://downloads.wordpress.org/plugin/woocommerce.10.9.4.zip'
          curl --fail --location --retry 5 --retry-all-errors "$url" --output woocommerce-10.9.4.zip
          unzip -tq woocommerce-10.9.4.zip >/dev/null
          digest="$(sha256sum woocommerce-10.9.4.zip | awk '{print $1}')"
          printf 'WOOCOMMERCE_SHA256=%s\n' "$digest" | tee .woocommerce-10.9.4.sha256.env

      - name: Commit resolved checksum for review
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .woocommerce-10.9.4.sha256.env
          git diff --cached --quiet && exit 0
          git commit -m 'ci: record official WooCommerce 10.9.4 checksum'
          git push origin HEAD:fix/full-audit-product-defects
