name: Sync versioned ShopOS release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing ShopOS release version to normalize, for example 0.15.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shopos-release-assets-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  sync:
    name: Repair exact versioned download names
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out current release tooling
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate requested published release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          version="$MANUAL_VERSION"
          [[ "$version" =~ $semver_re ]] || {
            echo "Invalid ShopOS release version: $version" >&2
            exit 1
          }
          gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved existing ShopOS release v${version}."

      - name: Rename assets and synchronize release table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          bash scripts/sync-release-assets.sh "$RELEASE_VERSION" "$GITHUB_REPOSITORY"
