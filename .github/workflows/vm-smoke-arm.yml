name: ShopOS QEMU acceptance test ARM host

on:
  pull_request:
    branches: [main, agent/fix-firstboot-mariadb-permissions]
    paths:
      - tests/run-qemu-smoke.sh
      - tests/prepare-qemu-image.sh
      - .github/workflows/vm-smoke-arm.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qemu-smoke-arm:
    name: Boot and initialize on an ARM64 runner
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 50
    steps:
      - name: Check out test harness
        uses: actions/checkout@v7

      - name: Install QEMU and image tools
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes qemu-system-arm qemu-utils zstd unzip curl util-linux
          qemu-system-aarch64 --version
          qemu-system-aarch64 -machine help | grep '^raspi4b '
          bash -n tests/prepare-qemu-image.sh
          bash tests/run-qemu-smoke.sh --self-test

      - name: Download and verify ShopOS admin console image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHOPOS_ARTIFACT_ID: '8907244734'
          SHOPOS_ARTIFACT_SHA256: 0098059dd63851485f3d7a11b2ca854c4d8e8ffbe8eb45cc4493cea0dba58aed
        run: |
          set -Eeuo pipefail
          mkdir -p vm
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SHOPOS_ARTIFACT_ID}/zip" > vm/artifact.zip
          printf '%s  %s\n' "$SHOPOS_ARTIFACT_SHA256" vm/artifact.zip | sha256sum --check --strict
          unzip -q vm/artifact.zip -d vm
          cd vm
          sha256sum --check msfixit-shopos-rpi4-usb.img.zst.sha256
          unzstd --no-progress msfixit-shopos-rpi4-usb.img.zst -o shopos-test.img
          rm -f artifact.zip msfixit-shopos-rpi4-usb.img.zst
          truncate -s 16G shopos-test.img
          ls -lh shopos-test.img
          df -h .

      - name: Prepare offline QEMU guest
        shell: bash
        run: sudo bash tests/prepare-qemu-image.sh vm/shopos-test.img

      - name: Boot, initialize and validate ShopOS
        shell: bash
        run: |
          set -Eeuo pipefail
          qemu_step_pid=''
          heartbeat_pid=''
          interrupted=0

          snapshot_console() {
            local source=vm/qemu-console.full.log
            if sudo test -f "$source"; then
              printf 'QEMU console bytes: '
              sudo stat -c '%s' "$source" 2>/dev/null || true
              printf '%s\n' '--- latest QEMU console output ---'
              sudo tail -n 30 "$source" 2>/dev/null || true
              sudo cp "$source" vm/qemu-console.log 2>/dev/null || true
            else
              printf '%s\n' 'QEMU console file has not been created yet.'
            fi
          }

          handle_interrupt() {
            interrupted=1
            printf '%s\n' 'Workflow interruption received; stopping QEMU and preserving evidence.'
            sudo pkill -TERM -f 'qemu-system-aarch64.*shopos-test.img' 2>/dev/null || true
            snapshot_console
          }
          trap handle_interrupt TERM INT

          sudo bash -x tests/run-qemu-smoke.sh vm/shopos-test.img vm 2>&1 | tee vm/harness.log &
          qemu_step_pid=$!

          (
            while kill -0 "$qemu_step_pid" 2>/dev/null; do
              sleep 60
              kill -0 "$qemu_step_pid" 2>/dev/null || break
              printf '%s\n' "QEMU_HEARTBEAT $(date --iso-8601=seconds)"
              snapshot_console
            done
          ) &
          heartbeat_pid=$!

          set +e
          wait "$qemu_step_pid"
          qemu_rc=$?
          set -e
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          snapshot_console

          if [ "$interrupted" -eq 1 ]; then
            printf 'QEMU_EXIT=interrupted\n' > vm/qemu-exit.txt
            exit 143
          fi
          exit "$qemu_rc"

      - name: Prepare VM evidence for upload
        if: always()
        shell: bash
        run: |
          if sudo test -f vm/qemu-console.full.log && ! sudo test -f vm/qemu-console.log; then
            sudo cp vm/qemu-console.full.log vm/qemu-console.log || true
          fi
          if ! sudo test -f vm/qemu-exit.txt; then
            printf 'QEMU_EXIT=workflow-interrupted-before-harness-finalization\n' | sudo tee vm/qemu-exit.txt >/dev/null
          fi
          sudo chown -R "$USER:$USER" vm 2>/dev/null || true
          find vm -type d -exec chmod u+rwx {} + 2>/dev/null || true
          find vm -type f -exec chmod u+rw {} + 2>/dev/null || true

      - name: Upload VM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shopos-admin-console-qemu-arm-smoke-evidence
          path: |
            vm/harness.log
            vm/qemu-version.txt
            vm/qemu-console.log
            vm/qemu-console.full.log
            vm/qemu-exit.txt
            vm/partition-identifiers.txt
            vm/fstab.before
            vm/fstab.after
            vm/initramfs-selection.txt
            vm/kernel-command-line.txt
            vm/msfixit-vm-smoke.log
            vm/msfixit-vm-smoke.result
            vm/msfixit-firstboot.log
            vm/guest-journal.log
            vm/guest-filesystem-state.txt
          if-no-files-found: warn
          retention-days: 14
