name: ShopOS release gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: shopos-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test complete ShopOS tree
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli python3 openssl sqlite3 shellcheck

      - name: Run repository test suite
        run: make check

      - name: Run integrated platform tests
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          tests=(tests/test-shopos-*.sh tests/test-guided-device-wizard.sh tests/test-admin-console-foundation.sh)
          if (( ${#tests[@]} == 0 )); then
            echo 'No integrated ShopOS tests found.' >&2
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            bash "$test_file"
            echo '::endgroup::'
          done

  image:
    name: Build and verify candidate image
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out tested candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          df -h

      - name: Build fresh Raspberry Pi 4 USB image
        run: make image-rpi4-usb

      - name: Verify candidate image
        run: scripts/generate-release-metadata.sh artifacts candidate "$GITHUB_SHA" "$GITHUB_RUN_ID"

      - name: Upload candidate image
        uses: actions/upload-artifact@v4
        with:
          name: shopos-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  merge:
    name: Merge verified candidate to main
    needs: [test, image]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge only the verified head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          VERIFIED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          gh pr merge "$PR_URL" \
            --squash \
            --delete-branch \
            --match-head-commit "$VERIFIED_HEAD_SHA"
