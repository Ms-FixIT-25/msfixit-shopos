name: ShopOS release gate

on:
  pull_request:
    branches: [integration/shopos-master-consolidation]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [integration/shopos-master-consolidation]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: shopos-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test exact PR80/candidate tree
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install test dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes php-cli python3 openssl sqlite3 shellcheck
      - name: Run repository test suite
        run: |
          bash -n scripts/generate-release-metadata.sh
          bash -n scripts/install-qemu-raspi4.sh
          bash -n tests/normalize-qemu-sd-size.sh
          bash tests/normalize-qemu-sd-size.sh --self-test
          make check
      - name: Run integrated platform tests
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          tests=(tests/test-shopos-*.sh tests/test-guided-device-wizard.sh tests/test-admin-console-foundation.sh)
          if (( ${#tests[@]} == 0 )); then
            echo 'No integrated ShopOS tests found.' >&2
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            bash "$test_file"
            echo '::endgroup::'
          done

  image:
    name: Build and verify exact candidate image
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out exact tested candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          df -h
      - name: Build fresh Raspberry Pi 4 USB image
        env:
          SHOPOS_BUILD_DESKTOP_ZIP: "0"
          SHOPOS_XZ_LEVEL: "1"
        run: make image-rpi4-usb
      - name: Verify candidate image
        run: bash scripts/generate-release-metadata.sh artifacts candidate "${{ github.event.pull_request.head.sha || github.sha }}" "$GITHUB_RUN_ID"
      - name: Upload candidate image
        uses: actions/upload-artifact@v7
        with:
          name: shopos-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  qemu:
    name: Boot candidate on ARM64
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    steps:
      - name: Check out exact tested candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          df -h
      - name: Restore pinned QEMU build
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/shopos-qemu/9.2.4
          key: shopos-qemu-9.2.4-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build pinned QEMU with Raspberry Pi 4 support
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-qemu-raspi4.sh "$HOME/.cache/shopos-qemu/9.2.4"
      - name: Validate QEMU and harness
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "$HOME/.cache/shopos-qemu/9.2.4/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cache/shopos-qemu/9.2.4/bin:$PATH"
          mkdir -p vm
          qemu-system-aarch64 --version | tee vm/qemu-version.txt
          qemu-system-aarch64 -machine help | tee vm/qemu-machines.txt
          grep -Eq '^[[:space:]]*raspi4b([[:space:]]|$)' vm/qemu-machines.txt
          bash -n tests/prepare-qemu-image.sh
          bash -n tests/normalize-qemu-sd-size.sh
          bash tests/normalize-qemu-sd-size.sh --self-test
          bash tests/run-qemu-smoke.sh --self-test
      - name: Download the exact candidate from this workflow
        uses: actions/download-artifact@v4
        with:
          name: shopos-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Verify and unpack the exact candidate image
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p vm
          image_xz="$(find candidate -type f -name 'msfixit-shopos-rpi4-usb.img.xz' -print -quit)"
          test -n "$image_xz"
          test -s "$image_xz"
          checksum="${image_xz}.sha256"
          test -s "$checksum"
          (
            cd "$(dirname "$image_xz")"
            sha256sum --check --strict "$(basename "$checksum")"
          )
          xz --decompress --stdout "$image_xz" > vm/shopos-test.img
          test -s vm/shopos-test.img
          printf 'Candidate raw image size: %s bytes\n' "$(stat -c '%s' vm/shopos-test.img)"
          bash tests/normalize-qemu-sd-size.sh vm/shopos-test.img | tee vm/qemu-disk-size.txt
          test "$(stat -c '%s' vm/shopos-test.img)" = 68719476736
          df -h .
      - name: Prepare offline QEMU guest
        run: sudo bash tests/prepare-qemu-image.sh vm/shopos-test.img
      - name: Boot, initialize and validate ShopOS
        shell: bash
        run: |
          set -Eeuo pipefail
          qemu_path="$HOME/.cache/shopos-qemu/9.2.4/bin"
          sudo env PATH="$qemu_path:$PATH" \
            bash -x tests/run-qemu-smoke.sh vm/shopos-test.img vm \
            2>&1 | tee vm/harness.log
          grep -Fxq 'MSFIXIT_VM_SMOKE_RESULT=PASS failures=0' vm/msfixit-vm-smoke.result
      - name: Prepare QEMU evidence
        if: always()
        run: |
          mkdir -p vm
          sudo chown -R "$USER:$USER" vm 2>/dev/null || true
          find vm -type d -exec chmod u+rwx {} + 2>/dev/null || true
          find vm -type f -exec chmod u+rw {} + 2>/dev/null || true
      - name: Upload QEMU evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shopos-candidate-qemu-evidence-ARM64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            vm/harness.log
            vm/qemu-version.txt
            vm/qemu-machines.txt
            vm/qemu-disk-size.txt
            vm/qemu-acceleration.txt
            vm/qemu-console.log
            vm/qemu-exit.txt
            vm/partition-identifiers.txt
            vm/fstab.before
            vm/fstab.after
            vm/initramfs-selection.txt
            vm/kernel-command-line.txt
            vm/msfixit-vm-smoke.log
            vm/msfixit-vm-smoke.result
            vm/msfixit-firstboot.log
            vm/guest-journal.log
            vm/guest-filesystem-state.txt
          if-no-files-found: warn
          retention-days: 14
