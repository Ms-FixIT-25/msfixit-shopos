name: ShopOS Raspberry Pi 4 VM smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  boot-and-initialize:
    name: Boot and initialize ShopOS under QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out test harness
        uses: actions/checkout@v7

      - name: Install QEMU and image tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes qemu-system-arm qemu-utils zstd unzip curl util-linux
          qemu-system-aarch64 --version
          qemu-system-aarch64 -machine help | grep '^raspi4b '
          bash -n tests/prepare-qemu-image.sh
          bash tests/run-qemu-smoke.sh --self-test

      - name: Download validated ShopOS image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8883903047'
          ARTIFACT_ZIP_SHA256: b5baf112e6bb1caddd2153759fabba7cad10dadb43b80a8d7b53c2537968c35c
        run: |
          set -Eeuo pipefail
          mkdir -p vm
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > vm/artifact.zip
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" vm/artifact.zip | sha256sum --check --strict
          unzip -q vm/artifact.zip -d vm
          cd vm
          sha256sum --check msfixit-shopos-rpi4-usb.img.zst.sha256
          unzstd --no-progress msfixit-shopos-rpi4-usb.img.zst -o shopos-test.img
          rm -f artifact.zip msfixit-shopos-rpi4-usb.img.zst
          truncate -s 16G shopos-test.img

      - name: Prepare offline QEMU guest
        shell: bash
        run: sudo bash tests/prepare-qemu-image.sh vm/shopos-test.img

      - name: Boot and run guest acceptance checks
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash -x tests/run-qemu-smoke.sh vm/shopos-test.img vm 2>&1 | tee vm/harness.log

      - name: Prepare VM evidence
        if: always()
        shell: bash
        run: |
          sudo chown -R "$USER:$USER" vm 2>/dev/null || true
          find vm -type d -exec chmod u+rwx {} + 2>/dev/null || true
          find vm -type f -exec chmod u+rw {} + 2>/dev/null || true

      - name: Upload VM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shopos-qemu-smoke-evidence
          path: |
            vm/harness.log
            vm/qemu-version.txt
            vm/qemu-console.log
            vm/qemu-console.full.log
            vm/qemu-exit.txt
            vm/partition-identifiers.txt
            vm/fstab.before
            vm/fstab.after
            vm/initramfs-selection.txt
            vm/kernel-command-line.txt
            vm/msfixit-vm-smoke.log
            vm/msfixit-vm-smoke.result
            vm/msfixit-firstboot.log
            vm/guest-journal.log
            vm/guest-filesystem-state.txt
          if-no-files-found: warn
          retention-days: 14
