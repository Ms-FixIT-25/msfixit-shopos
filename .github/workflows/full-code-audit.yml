name: Full ShopOS code audit

on:
  pull_request:
    branches:
      - fix/full-audit-product-defects
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-code-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Audit every tracked code/config file
    runs-on: ubuntu-24.04
    steps:
      - name: Check out audit candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install deterministic local analyzers
        run: |
          set -Eeuo pipefail
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes shellcheck php-cli jq
          actionlint_version=v1.7.7
          go install "github.com/rhysd/actionlint/cmd/actionlint@${actionlint_version}"
          printf '%s\n' "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run complete static audit
        run: |
          set -Eeuo pipefail
          chmod +x scripts/audit-full-repo.sh
          AUDIT_REPORT="$RUNNER_TEMP/full-code-audit.txt" scripts/audit-full-repo.sh

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-shopos-code-audit-${{ github.sha }}
          path: ${{ runner.temp }}/full-code-audit.txt
          if-no-files-found: warn
          retention-days: 14

  repository-contracts:
    name: Run repository-wide existing contract suite
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: shopos-ci-root
          MARIADB_DATABASE: shopos_catalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out audit candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install test clients
        run: |
          set -Eeuo pipefail
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes mariadb-client php-cli php-mysql php-mbstring php-zip php-tcpdf jq unzip openssh-client sshpass

      - name: Run Makefile contract suite
        run: make check
