name: ShopOS PR 60 integration validation

on:
  push:
    branches: [integration/pr60-shopos-hardware-fixes]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-improvements:
    name: Validate PR 50 through PR 60 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out combined source
        uses: actions/checkout@v7

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.parse_file(f); puts "PASS YAML: #{f}" }'

      - name: Validate script syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/build-image.sh
          bash -n scripts/postprocess-ab-image.sh
          python3 -m py_compile image/package/usr/local/sbin/msfixit-update-agent
          python3 -m py_compile image/package/usr/local/sbin/msfixit-update-center
          bash -n image/package/usr/local/sbin/msfixit-boot-console
          bash -n image/package/usr/local/sbin/msfixit-kiosk-session
          bash -n image/package/usr/local/sbin/msfixit-first-login-init
          bash -n image/package/usr/local/sbin/msfixit-wifi-connect
          bash -n image/package/usr/local/sbin/msfixit-apply-resource-budget
          bash -n image/package/usr/local/sbin/msfixit-thermal-check

      - name: Validate Update Center
        run: |
          bash tests/test-shopos-update-agent.sh
          bash tests/test-shopos-update-center.sh

      - name: Validate dense image and A-B boot
        run: |
          grep -Fq 'cp --sparse=never' scripts/build-image.sh
          grep -Fq '.img.zip' scripts/build-image.sh
          bash tests/test-shopos-ab-image-layout.sh

      - name: Validate boot experience
        run: bash tests/test-boot-experience.sh

      - name: Validate first-login Wi-Fi experience
        run: bash tests/test-first-login-wifi.sh

      - name: Validate Raspberry Pi thermal budget
        run: bash tests/test-pi-resource-budget.sh

      - name: Validate local graphical kiosk
        run: |
          grep -Fq 'chromium' image/package/DEBIAN/control
          grep -Fq 'msfixit-kiosk.service' image/package/DEBIAN/postinst
          grep -Fq -- '--kiosk' image/package/usr/local/sbin/msfixit-kiosk-session
          grep -Fq -- '-nolisten tcp' image/package/etc/systemd/system/msfixit-kiosk.service
          grep -Fq 'User=shopos-kiosk' image/package/etc/systemd/system/msfixit-kiosk.service

      - name: Verify integrated feature files
        run: |
          test -s image/package/usr/share/msfixit-shopos/admin-console/public/updates.php
          test -s docs/INSTALL_IMAGE.md
          test -s image/package/etc/systemd/system/msfixit-kiosk.service
          test -s image/package/usr/local/sbin/msfixit-wifi-connect
          test -s image/package/usr/local/sbin/msfixit-thermal-check
          echo 'PASS: PR 50 through PR 60 combined source is present and validated.'
