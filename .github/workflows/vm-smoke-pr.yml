name: ShopOS QEMU acceptance test

on:
  pull_request:
    branches: [main]
    paths:
      - tests/run-qemu-smoke.sh
      - .github/workflows/vm-smoke-pr.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qemu-smoke:
    name: Boot and initialize the Raspberry Pi 4 image
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - name: Check out test harness
        uses: actions/checkout@v7

      - name: Install QEMU and image tools
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes qemu-system-arm qemu-utils zstd unzip curl
          qemu-system-aarch64 --version
          qemu-system-aarch64 -machine help | grep '^raspi4b '

      - name: Download and verify ShopOS 0.14
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHOPOS_ARTIFACT_ID: '8883903047'
          SHOPOS_ARTIFACT_SHA256: b5baf112e6bb1caddd2153759fabba7cad10dadb43b80a8d7b53c2537968c35c
        run: |
          set -Eeuo pipefail
          mkdir -p vm
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SHOPOS_ARTIFACT_ID}/zip" > vm/artifact.zip
          printf '%s  %s\n' "$SHOPOS_ARTIFACT_SHA256" vm/artifact.zip | sha256sum --check --strict
          unzip -q vm/artifact.zip -d vm
          cd vm
          sha256sum --check msfixit-shopos-rpi4-usb.img.zst.sha256
          unzstd --no-progress msfixit-shopos-rpi4-usb.img.zst -o shopos-test.img
          rm -f artifact.zip msfixit-shopos-rpi4-usb.img.zst
          truncate -s 16G shopos-test.img
          ls -lh shopos-test.img
          df -h .

      - name: Boot, initialize and validate ShopOS
        shell: bash
        run: sudo bash tests/run-qemu-smoke.sh vm/shopos-test.img vm

      - name: Upload VM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shopos-0.14-qemu-smoke-evidence
          path: |
            vm/qemu-version.txt
            vm/qemu-console.log
            vm/qemu-exit.txt
            vm/msfixit-vm-smoke.log
            vm/msfixit-vm-smoke.result
            vm/msfixit-firstboot.log
            vm/guest-journal.log
          if-no-files-found: warn
          retention-days: 14
