name: ShopOS integrated validation

on:
  pull_request:
    branches: [main, fix/first-login-display-stability]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-platform:
    name: Validate the combined ShopOS platform
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out combined source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate workflow and script syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.parse_file(f); puts "PASS YAML: #{f}" }'
          bash -n scripts/build-image.sh
          bash -n scripts/postprocess-ab-image.sh
          bash -n scripts/install-qemu-raspi4.sh
          bash -n tests/normalize-qemu-sd-size.sh
          bash -n tests/prepare-qemu-image.sh
          bash -n tests/run-qemu-smoke.sh
          python3 -m py_compile image/package/usr/local/sbin/msfixit-update-agent
          python3 -m py_compile image/package/usr/local/sbin/msfixit-update-center
          bash -n image/package/usr/local/sbin/msfixit-boot-console
          bash -n image/package/usr/local/sbin/msfixit-kiosk-session
          bash -n image/package/usr/local/sbin/msfixit-first-login-init
          bash -n image/package/usr/local/sbin/msfixit-wifi-connect
          bash -n image/package/usr/local/sbin/msfixit-apply-resource-budget
          bash -n image/package/usr/local/sbin/msfixit-thermal-check

      - name: Validate Update Center
        run: |
          bash tests/test-shopos-update-agent.sh
          bash tests/test-shopos-update-center.sh

      - name: Validate dense release image and fast candidate mode
        run: |
          grep -Fq 'SHOPOS_BUILD_DESKTOP_ZIP:-1' scripts/build-image.sh
          grep -Fq 'SHOPOS_XZ_LEVEL:-6' scripts/build-image.sh
          grep -Fq 'cp --sparse=never' scripts/build-image.sh
          grep -Fq '.img.zip' scripts/build-image.sh
          grep -Fq 'pv --force --bytes --timer --eta --rate' scripts/build-image.sh
          grep -Fq 'SHOPOS_BUILD_DESKTOP_ZIP: "0"' .github/workflows/shopos-release-gate.yml
          grep -Fq 'SHOPOS_XZ_LEVEL: "1"' .github/workflows/shopos-release-gate.yml
          bash tests/test-shopos-ab-image-layout.sh

      - name: Validate boot experience
        run: bash tests/test-boot-experience.sh

      - name: Validate first-login Wi-Fi experience
        run: bash tests/test-first-login-wifi.sh

      - name: Validate Raspberry Pi thermal budget
        run: bash tests/test-pi-resource-budget.sh

      - name: Validate local graphical kiosk
        run: |
          grep -Fq 'chromium' image/package/DEBIAN/control
          grep -Fq 'msfixit-kiosk.service' image/package/DEBIAN/postinst
          grep -Fq -- '--kiosk' image/package/usr/local/sbin/msfixit-kiosk-session
          grep -Fq -- '-nolisten tcp' image/package/etc/systemd/system/msfixit-kiosk.service
          grep -Fq 'User=shopos-kiosk' image/package/etc/systemd/system/msfixit-kiosk.service

      - name: Validate QEMU release-gate contract
        run: |
          gate=.github/workflows/shopos-release-gate.yml
          dollar='$'
          grep -Fq "qemu_version='9.2.4'" scripts/install-qemu-raspi4.sh
          grep -Fq 'sha512sum --check --strict' scripts/install-qemu-raspi4.sh
          grep -Fq "name: Boot candidate on ${dollar}{{ matrix.host }} repeat ${dollar}{{ matrix.repeat }}" "$gate"
          grep -Fq 'host: ARM64' "$gate"
          grep -Fq 'host: X86_64' "$gate"
          test "$(grep -Fc 'host: ARM64' "$gate")" -eq 2
          test "$(grep -Fc 'host: X86_64' "$gate")" -eq 2
          grep -Fq 'runner: ubuntu-24.04-arm' "$gate"
          grep -Fq 'runner: ubuntu-24.04' "$gate"
          grep -Fq "runs-on: ${dollar}{{ matrix.runner }}" "$gate"
          if grep -Eq 'pull_request\.draft[[:space:]]*==[[:space:]]*false|draft[[:space:]]*==[[:space:]]*false' "$gate"; then
            echo 'Draft PRs must not be excluded from full system validation.' >&2
            exit 1
          fi
          grep -Fq -- '-accel kvm' tests/run-qemu-smoke.sh
          grep -Fq -- '-accel tcg,thread=multi' tests/run-qemu-smoke.sh
          grep -Fq 'cache=unsafe,aio=threads' tests/run-qemu-smoke.sh
          grep -Fq 'actions/download-artifact@v4' "$gate"
          grep -Fq 'sha256sum --check --strict' "$gate"
          grep -Fq 'production-cmdline.txt' "$gate"
          grep -Fq "grep -Fxc 'consoleblank=0'" "$gate"
          grep -Fq 'msfixit-first-login.service' tests/prepare-qemu-image.sh
          if grep -Fq 'gh pr merge' "$gate"; then
            echo 'Automatic merge must remain disabled.' >&2
            exit 1
          fi
          bash tests/normalize-qemu-sd-size.sh --self-test
          bash tests/run-qemu-smoke.sh --self-test

      - name: Verify integrated feature files
        run: |
          test -s image/package/usr/share/msfixit-shopos/admin-console/public/updates.php
          test -s docs/INSTALL_IMAGE.md
          test -s image/package/etc/systemd/system/msfixit-kiosk.service
          test -s image/package/usr/local/sbin/msfixit-wifi-connect
          test -s image/package/usr/local/sbin/msfixit-thermal-check
          test -s scripts/install-qemu-raspi4.sh
          test -s tests/normalize-qemu-sd-size.sh
          echo 'PASS: combined ShopOS platform and repeated dual-host release-gate contracts are valid.'
