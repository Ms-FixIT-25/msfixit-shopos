name: First-login package permissions

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/build-package.sh
      - image/package/usr/local/sbin/msfixit-first-login-init
      - image/package/etc/systemd/system/msfixit-first-login.service
      - tests/test-shopos-first-login-package-permissions.sh
      - .github/workflows/first-login-package-permissions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-login-package-permissions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Verify first-login executable package contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out product fix
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact PR candidate source
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Check shell syntax
        run: |
          set -Eeuo pipefail
          bash -n scripts/build-package.sh
          bash -n tests/test-shopos-first-login-package-permissions.sh

      - name: Run first-login package regression
        run: bash tests/test-shopos-first-login-package-permissions.sh
