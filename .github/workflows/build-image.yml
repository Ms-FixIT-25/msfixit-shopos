name: Build ShopOS image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - docs/**
      - Makefile
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - docs/**
      - Makefile
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      device:
        description: Raspberry Pi target
        required: true
        default: rpi4
        type: choice
        options:
          - rpi4
          - rpi5
      storage:
        description: Storage target to build
        required: true
        default: usb
        type: choice
        options:
          - usb
          - sd
          - nvme

permissions:
  contents: write

concurrency:
  group: shopos-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate article, Office and fulfillment cores
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: shopos-ci-root
          MARIADB_DATABASE: shopos_catalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v7

      - name: Check source syntax
        run: make check

      - name: Install database, PDF and ZIP test clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client php-mysql php-zip php-tcpdf jq unzip

      - name: Apply and test article-master schema
        shell: bash
        env:
          MYSQL_PWD: shopos-ci-root
        run: |
          set -Eeuo pipefail
          db=(mariadb --host=127.0.0.1 --port=3306 --user=root shopos_catalog)
          "${db[@]}" < image/package/usr/share/msfixit-shopos/catalog/schema.sql
          "${db[@]}" < image/package/usr/share/msfixit-shopos/catalog/guards.sql

          cat > /tmp/catalog.env <<'EOF_CATALOG'
          CATALOG_DB_HOST=127.0.0.1
          CATALOG_DB_PORT=3306
          CATALOG_DB_NAME=shopos_catalog
          CATALOG_DB_USER=root
          CATALOG_DB_PASSWORD=shopos-ci-root
          EOF_CATALOG
          sudo install -d -m 0750 /etc/msfixit-shopos
          sudo install -m 0600 /tmp/catalog.env /etc/msfixit-shopos/catalog.env

          article="$(sudo php image/package/usr/local/sbin/msfixit-catalog create 'CI Test Product' simple)"
          test "$article" = MF-00000001

          sudo php image/package/usr/local/sbin/msfixit-catalog \
            map "$article" supplier:ci SUP-100 primary
          sudo php image/package/usr/local/sbin/msfixit-catalog \
            offer "$article" ci SUP-100 42.50 EUR 7 available
          sudo php image/package/usr/local/sbin/msfixit-catalog \
            channel "$article" woocommerce 384 "$article" active
          sudo php image/package/usr/local/sbin/msfixit-catalog show "$article" \
            | jq -e '.article_number == "MF-00000001"'
          sudo php image/package/usr/local/sbin/msfixit-catalog \
            resolve supplier:ci SUP-100 \
            | jq -e '.article_number == "MF-00000001"'
          sudo php image/package/usr/local/sbin/msfixit-catalog \
            export-csv /tmp/article-master.csv
          grep -q 'MF-00000001' /tmp/article-master.csv

          if "${db[@]}" --execute="UPDATE catalog_products SET article_number='MF-99999999' WHERE article_number='MF-00000001'"; then
            echo 'Article-number immutability trigger did not block an update.' >&2
            exit 1
          fi

          if "${db[@]}" --execute="DELETE FROM catalog_products WHERE article_number='MF-00000001'"; then
            echo 'Archive-only trigger did not block a delete.' >&2
            exit 1
          fi

          trigger_count="$("${db[@]}" --batch --skip-column-names \
            --execute="SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='shopos_catalog'")"
          test "$trigger_count" -ge 5

      - name: Apply and test Office and fulfillment core
        shell: bash
        env:
          MYSQL_PWD: shopos-ci-root
        run: |
          set -Eeuo pipefail
          root_db=(mariadb --host=127.0.0.1 --port=3306 --user=root)
          "${root_db[@]}" --execute="CREATE DATABASE shopos_office CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          office_db=(mariadb --host=127.0.0.1 --port=3306 --user=root shopos_office)
          "${office_db[@]}" < image/package/usr/share/msfixit-shopos/office/schema.sql
          "${office_db[@]}" < image/package/usr/share/msfixit-shopos/office/operational.sql

          cat > /tmp/office.env <<'EOF_OFFICE'
          OFFICE_DB_HOST=127.0.0.1
          OFFICE_DB_PORT=3306
          OFFICE_DB_NAME=shopos_office
          OFFICE_DB_USER=root
          OFFICE_DB_PASSWORD=shopos-ci-root
          EOF_OFFICE

          cat > /tmp/business.env <<'EOF_BUSINESS'
          BUSINESS_CONFIG_APPROVED=yes
          BUSINESS_NAME=Ms. FixIT
          BUSINESS_LEGAL_NAME=Ms. FixIT CI Test
          BUSINESS_OWNER_NAME=CI
          BUSINESS_STREET=Teststraße 1
          BUSINESS_POSTCODE=5020
          BUSINESS_CITY=Salzburg
          BUSINESS_COUNTRY=AT
          BUSINESS_EMAIL=ci@example.invalid
          BUSINESS_PHONE=+430000000
          BUSINESS_WEBSITE=https://example.invalid
          BUSINESS_TAX_NUMBER=CI-TAX
          BUSINESS_VAT_ID=
          BUSINESS_IBAN=AT000000000000000000
          BUSINESS_BIC=TESTAT00
          DEFAULT_TAX_MODE=at_small_business_exempt
          TAX_MODE_AT=at_small_business_exempt
          TAX_MODE_DE=review_required
          TAX_MODE_CH=review_required
          SMALL_BUSINESS_NOTICE=Umsatzsteuerbefreit aufgrund der Kleinunternehmerregelung.
          INVOICE_PREFIX=RE
          CREDIT_NOTE_PREFIX=GU
          DELIVERY_NOTE_PREFIX=LS
          REMINDER_PREFIX=MA
          SHIPMENT_PREFIX=VS
          INVOICE_PAYMENT_DAYS=0
          INVOICE_LANGUAGE=de_AT
          INVOICE_CURRENCY=EUR
          AUTO_FINALIZE_INVOICES=no
          AUTO_FINALIZE_DELIVERY_NOTES=no
          AUTO_SEND_INVOICES=no
          AUTO_SEND_REMINDERS=no
          AUTO_PRINT_INVOICES=no
          AUTO_PRINT_DELIVERY_NOTES=no
          AUTO_PRINT_LABELS=no
          DUNNING_ENABLED=yes
          DUNNING_AUTO_CREATE_FRIENDLY_REMINDER=yes
          DUNNING_REQUIRE_APPROVAL_FROM_LEVEL=1
          PROSALDO_EXPORT_ENABLED=yes
          PROSALDO_EXPORT_PATH=/data/office/exports/prosaldo
          PROSALDO_CONTACT_NUMBER_PREFIX=K
          EOF_BUSINESS

          sudo install -d -m 0750 /etc/msfixit-shopos /usr/share/msfixit-shopos /data/office
          sudo install -m 0600 /tmp/office.env /etc/msfixit-shopos/office.env
          sudo install -m 0600 /tmp/office.env /etc/msfixit-shopos/office-worker.env
          sudo install -m 0640 /tmp/business.env /etc/msfixit-shopos/business.env
          sudo ln -s "$GITHUB_WORKSPACE/image/package/usr/share/msfixit-shopos/office" /usr/share/msfixit-shopos/office
          sudo mkdir -p \
            /data/office/documents/invoices \
            /data/office/documents/credit-notes \
            /data/office/documents/delivery-notes \
            /data/office/documents/reminders \
            /data/office/documents/customs \
            /data/office/labels \
            /data/office/exports/prosaldo \
            /data/office/archive

          cat > /tmp/order.json <<'EOF_ORDER'
          {
            "source_system": "woocommerce",
            "source_order_id": "1001",
            "source_order_number": "1001",
            "source_document_id": "1001",
            "order_status": "processing",
            "customer_type": "consumer",
            "currency": "EUR",
            "issue_date": "2026-07-01",
            "service_date": "2026-07-01",
            "tax_mode": "at_small_business_exempt",
            "billing": {
              "first_name": "Erika",
              "last_name": "Mustermann",
              "address_1": "Musterweg 2",
              "postcode": "5020",
              "city": "Salzburg",
              "country": "AT",
              "email": "erika@example.invalid"
            },
            "shipping": {
              "first_name": "Erika",
              "last_name": "Mustermann",
              "address_1": "Musterweg 2",
              "postcode": "5020",
              "city": "Salzburg",
              "country": "AT"
            },
            "totals": {"net": 119.90, "tax": 0, "gross": 119.90},
            "lines": [{
              "article_number": "MF-00000001",
              "description": "CI Test Product",
              "quantity": 1,
              "unit": "Stk",
              "unit_net": 119.90,
              "tax_rate": 0,
              "line_net": 119.90,
              "line_tax": 0,
              "line_gross": 119.90,
              "metadata": {"hs_code": "84718000", "origin_country": "DE"}
            }]
          }
          EOF_ORDER

          office=(sudo php image/package/usr/local/sbin/msfixit-office)
          invoice_json="$("${office[@]}" document-create invoice /tmp/order.json)"
          invoice_id="$(jq -r '.id' <<< "$invoice_json")"
          test -n "$invoice_id"

          finalized_json="$("${office[@]}" document-finalize "$invoice_id")"
          invoice_number="$(jq -r '.document_number' <<< "$finalized_json")"
          invoice_pdf="$(jq -r '.pdf_path' <<< "$finalized_json")"
          test "$invoice_number" = RE-2026-000001
          test -s "$invoice_pdf"
          sha256sum "$invoice_pdf"

          if "${office_db[@]}" --execute="UPDATE office_documents SET gross_total=1 WHERE id='${invoice_id}'"; then
            echo 'Final invoice immutability trigger did not block an update.' >&2
            exit 1
          fi
          if "${office_db[@]}" --execute="DELETE FROM office_documents WHERE id='${invoice_id}'"; then
            echo 'Final invoice deletion trigger did not block a delete.' >&2
            exit 1
          fi

          payment_json="$("${office[@]}" payment-record "$invoice_number" bank BANK-CI-1 20.00 EUR '2026-07-02 10:00:00' "$invoice_number")"
          jq -e '.open_amount == 99.9' <<< "$payment_json"

          dry_run="$("${office[@]}" dunning-run --dry-run)"
          jq -e '.created | length == 1' <<< "$dry_run"
          dunning_result="$("${office[@]}" dunning-run)"
          jq -e '.created | length == 1' <<< "$dunning_result"
          reminder_pdf="$("${office_db[@]}" -Nse "SELECT pdf_path FROM office_reminders WHERE document_id='${invoice_id}' AND reminder_level=0")"
          test -s "$reminder_pdf"

          export_json="$("${office[@]}" prosaldo-export 2026-07-01 2026-07-31)"
          export_path="$(jq -r '.export_path' <<< "$export_json")"
          test -s "$export_path"
          unzip -l "$export_path" | grep -q 'documents.csv'
          unzip -l "$export_path" | grep -q 'manifest.json'
          unzip -l "$export_path" | grep -q 'pdf/RE-2026-000001.pdf'

          cat > /tmp/shipment.json <<'EOF_SHIPMENT'
          {
            "source_system": "woocommerce",
            "source_order_id": "1001",
            "source_order_number": "1001",
            "order_status": "processing",
            "customer_type": "consumer",
            "currency": "EUR",
            "billing": {"first_name":"Erika","last_name":"Mustermann","country":"AT"},
            "shipping": {
              "first_name": "Erika",
              "last_name": "Mustermann",
              "address_1": "Musterweg 2",
              "postcode": "5020",
              "city": "Salzburg",
              "country": "AT"
            },
            "totals": {"net":119.90,"tax":0,"gross":119.90},
            "carrier_code": "post_at",
            "carrier_product": "test",
            "ship_date": "2026-07-02",
            "packages": [{
              "weight_kg": 1.25,
              "length_cm": 30,
              "width_cm": 20,
              "height_cm": 10,
              "contents_description": "CI Test Product",
              "value_amount": 119.90,
              "value_currency": "EUR"
            }]
          }
          EOF_SHIPMENT

          shipment_json="$("${office[@]}" shipment-create /tmp/shipment.json)"
          shipment_id="$(jq -r '.id' <<< "$shipment_json")"
          shipment_number="$(jq -r '.shipment_number' <<< "$shipment_json")"
          test "$shipment_number" = VS-2026-000001
          label_json="$("${office[@]}" label-import "$shipment_id" "$invoice_pdf" TRACK-CI-1)"
          label_path="$(jq -r '.path' <<< "$label_json")"
          test -s "$label_path"
          "${office[@]}" carrier-list | jq -e '.[] | select(.carrier_code == "post_at" and .enabled == 0)'
          "${office[@]}" status | jq -e '.state == "configured"'

          trigger_count="$("${office_db[@]}" --batch --skip-column-names \
            --execute="SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='shopos_office'")"
          test "$trigger_count" -ge 5

  build:
    name: Build ShopOS image
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v7

      - name: Select target
        shell: bash
        run: |
          device='${{ github.event.inputs.device }}'
          storage='${{ github.event.inputs.storage }}'
          if [ -z "$device" ]; then
            device=rpi4
          fi
          if [ -z "$storage" ]; then
            storage=usb
          fi
          if [ "$device" = rpi4 ] && [ "$storage" = nvme ]; then
            echo "Raspberry Pi 4B has no native NVMe target; select USB for an NVMe USB enclosure." >&2
            exit 2
          fi
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          echo "STORAGE=$storage" >> "$GITHUB_ENV"

      - name: Build flash image
        run: bash scripts/build-image.sh "$DEVICE" "$STORAGE"

      - name: Show image checksums
        run: cat artifacts/*.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: msfixit-shopos-${{ env.DEVICE }}-${{ env.STORAGE }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish Raspberry Pi 4B GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DEVICE == 'rpi4' && env.STORAGE == 'usb'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < image/VERSION)"
          tag="v${version}"
          title="Ms. FixIT ShopOS ${version}"
          notes_file="$(mktemp)"

          cat > "$notes_file" <<EOF
          Flash-ready Raspberry Pi 4 Model B USB-SSD image for Ms. FixIT ShopOS.

          Included downloads:
          - compressed Raspberry Pi 4B ShopOS image
          - portable SHA-256 checksum

          This build includes DACH WooCommerce, the permanent Ms. FixIT article master, immutable invoice and delivery-note documents, payment allocation, guarded reminders, ProSaldo handoff packages, shipment/label storage and CUPS print queues.

          Production tax profiles, legal wording, payment providers, shipping prices, carrier contracts/API credentials, Swiss customs workflow and real printers still require deliberate configuration and physical testing. Carrier APIs remain disabled until contract-specific onboarding is completed.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes_file"
            gh release upload "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file"
          fi
