name: Build ShopOS image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - Makefile
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - Makefile
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      device:
        description: Raspberry Pi target
        required: true
        default: rpi4
        type: choice
        options:
          - rpi4
          - rpi5
      storage:
        description: Storage target to build
        required: true
        default: usb
        type: choice
        options:
          - usb
          - sd
          - nvme

permissions:
  contents: write

concurrency:
  group: shopos-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: make check

  build:
    name: Build ShopOS image
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v7

      - name: Select target
        shell: bash
        run: |
          device='${{ github.event.inputs.device }}'
          storage='${{ github.event.inputs.storage }}'
          if [ -z "$device" ]; then
            device=rpi4
          fi
          if [ -z "$storage" ]; then
            storage=usb
          fi
          if [ "$device" = rpi4 ] && [ "$storage" = nvme ]; then
            echo "Raspberry Pi 4B has no native NVMe target; select USB for an NVMe USB enclosure." >&2
            exit 2
          fi
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          echo "STORAGE=$storage" >> "$GITHUB_ENV"

      - name: Build flash image
        run: bash scripts/build-image.sh "$DEVICE" "$STORAGE"

      - name: Show image checksums
        run: cat artifacts/*.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: msfixit-shopos-${{ env.DEVICE }}-${{ env.STORAGE }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish Raspberry Pi 4B GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DEVICE == 'rpi4' && env.STORAGE == 'usb'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < image/VERSION)"
          tag="v${version}"
          title="Ms. FixIT ShopOS ${version}"
          notes_file="$(mktemp)"

          cat > "$notes_file" <<EOF
          Flash-ready Raspberry Pi 4 Model B USB-SSD image for Ms. FixIT ShopOS.

          Included downloads:
          - compressed Raspberry Pi 4B ShopOS image
          - portable SHA-256 checksum

          Do not flash the earlier Raspberry Pi 5 image onto a Raspberry Pi 4B. USB boot on a Pi 4B requires a sufficiently recent EEPROM bootloader. Physical first-boot validation on the target Raspberry Pi is still required before connecting the production domain.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes_file"
            gh release upload "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file"
          fi
