name: Build ShopOS image

on:
  push:
    branches: [main, agent/admin-console-foundation]
    paths:
      - image/**
      - scripts/**
      - tests/**
      - docs/**
      - Makefile
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - tests/**
      - docs/**
      - Makefile
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      device:
        description: Raspberry Pi target
        required: true
        default: rpi4
        type: choice
        options: [rpi4, rpi5]
      storage:
        description: Storage target to build
        required: true
        default: usb
        type: choice
        options: [usb, sd, nvme]

permissions:
  contents: write

concurrency:
  group: shopos-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate help, partners, AT pilot, ALSO, Office and compliance cores
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: shopos-ci-root
          MARIADB_DATABASE: shopos_catalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v7

      - name: Install database, PDF, SFTP and PHP test clients
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes mariadb-client php-mysql php-mbstring php-zip php-tcpdf jq unzip openssh-client sshpass

      - name: Check source syntax and cable discovery logic
        run: make check

      - name: Test article master
        env:
          MYSQL_PWD: shopos-ci-root
        run: bash tests/test-catalog.sh

      - name: Test verified partner claims and logo rights
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash tests/test-partners.sh

      - name: Test AT pilot and ALSO commercial feed staging
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" bash tests/test-also.sh

      - name: Test licensed ALSO content, images and documents
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash tests/test-also-content.sh

      - name: Test protected Office and fulfillment data
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash tests/test-office.sh

      - name: Test versioned Office migrations
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" bash tests/test-office-migrations.sh

      - name: Test immutable document and payment guards
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" bash tests/test-office-guards.sh

      - name: Test least-privilege WordPress Office access
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" bash tests/test-office-privileges.sh

      - name: Test Austrian and DACH legal compliance kernel
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash tests/test-compliance.sh

      - name: Test strict DACH evidence and tax-case guards
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash tests/test-compliance-strict.sh

      - name: Test case-aware tax decisions and renderer boundaries
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash tests/test-tax-renderer-boundary.sh

      - name: Test compliance rejection before invoice numbering
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" bash tests/test-compliance-numbering.sh

  build:
    name: Build ShopOS image
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v7

      - name: Select target
        shell: bash
        run: |
          device='${{ github.event.inputs.device }}'
          storage='${{ github.event.inputs.storage }}'
          [ -n "$device" ] || device=rpi4
          [ -n "$storage" ] || storage=usb
          if [ "$device" = rpi4 ] && [ "$storage" = nvme ]; then
            echo "Raspberry Pi 4B has no native NVMe target; select USB for an NVMe USB enclosure." >&2
            exit 2
          fi
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          echo "STORAGE=$storage" >> "$GITHUB_ENV"

      - name: Build flash image
        run: bash scripts/build-image.sh "$DEVICE" "$STORAGE"

      - name: Show image checksums
        run: cat artifacts/*.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: msfixit-shopos-${{ env.DEVICE }}-${{ env.STORAGE }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish Raspberry Pi 4B GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DEVICE == 'rpi4' && env.STORAGE == 'usb'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < image/VERSION)"
          tag="v${version}"
          title="Ms. FixIT ShopOS ${version}"
          notes_file="$(mktemp)"

          cat > "$notes_file" <<'EOF'
          ## ShopOS einmal installieren – danach über das Update Center warten

          Dieses Release enthält das vollständige, startfähige ShopOS-Image für einen Raspberry Pi 4 Model B. Das Image wird einmalig auf die SD-Karte oder ein USB-SSD-Laufwerk geschrieben. Normale spätere ShopOS- und App-Aktualisierungen sollen anschließend direkt im lokalen **ShopOS Control Center** erfolgen, ohne das Speichermedium erneut an einen PC anschließen zu müssen.

          ### Welcher Download ist richtig?

          | Betriebssystem | Empfohlene Datei | Verwendung |
          |---|---|---|
          | Windows 10/11 | `msfixit-shopos-rpi4-usb.img.zip` | ZIP vollständig entpacken und die enthaltene `.img` mit Raspberry Pi Imager schreiben |
          | macOS | `msfixit-shopos-rpi4-usb.img.zip` | ZIP im Finder vollständig entpacken und die enthaltene `.img` mit Raspberry Pi Imager schreiben |
          | Linux | `msfixit-shopos-rpi4-usb.img.xz` | Direkt mit Raspberry Pi Imager verwenden oder zuerst mit `xz` entpacken |

          Das ZIP-Paket ist die empfohlene Desktop-Version für Windows und macOS. Das enthaltene Image wird vollständig materialisiert und besitzt nach dem Entpacken keine Sparse-Lücken. Dadurch soll Raspberry Pi Imager den Schreibfortschritt korrekt von 0 bis 100 Prozent anzeigen.

          Ein separates DMG wird bewusst nicht angeboten: Raspberry Pi Imager benötigt ein unverändertes Rohabbild im `.img`-Format. Ein DMG würde keinen technischen Vorteil bringen und nur ein weiteres großes, inhaltlich identisches Release-Asset erzeugen.

          ### Installation unter Windows

          1. `msfixit-shopos-rpi4-usb.img.zip` und die zugehörige `.sha256`-Datei herunterladen.
          2. Das ZIP vollständig über **Alle extrahieren** entpacken. Die IMG-Datei nicht direkt aus dem ZIP öffnen.
          3. Raspberry Pi Imager starten und **Eigenes Image verwenden** auswählen.
          4. Die entpackte `.img`-Datei und anschließend das Zielmedium auswählen.
          5. Schreiben und Verifizieren vollständig abschließen lassen.

          ### Installation unter macOS

          1. `msfixit-shopos-rpi4-usb.img.zip` und die zugehörige `.sha256`-Datei herunterladen.
          2. Das ZIP per Doppelklick im Finder vollständig entpacken.
          3. Raspberry Pi Imager starten und **Use custom** beziehungsweise **Eigenes Image verwenden** auswählen.
          4. Die entpackte `.img`-Datei und anschließend das Zielmedium auswählen.
          5. Das angeforderte macOS-Administratorkennwort bestätigen und die Verifikation vollständig abwarten.

          ### Installation unter Linux

          1. `msfixit-shopos-rpi4-usb.img.xz` und die zugehörige `.sha256`-Datei herunterladen.
          2. Die Prüfsumme kontrollieren.
          3. Das XZ-Image direkt mit Raspberry Pi Imager verwenden oder zuerst entpacken.
          4. Schreiben und Verifizieren vollständig abschließen lassen.

          Danach das Medium in den Raspberry Pi einsetzen, den Einrichtungsassistenten abschließen und künftige System- sowie App-Aktualisierungen im **ShopOS Update Center** durchführen.

          ### Aktualisierung ohne erneutes Flashen

          ShopOS besitzt zwei getrennte Root-Systembereiche. Ein Systemupdate wird ausschließlich in den gerade inaktiven Bereich geschrieben, vollständig geprüft und beim nächsten Neustart testweise aktiviert. Startet die neue Version wiederholt nicht erfolgreich, schaltet ShopOS automatisch auf den vorherigen funktionierenden Bereich zurück.

          Im Update Center können Administratoren:

          - manuell nach ShopOS-Systemupdates suchen,
          - Download und Installation starten,
          - aktiven A/B-Slot und Updatezustand sehen,
          - einen erforderlichen Neustart auslösen,
          - nach App-Updates suchen,
          - Apps einzeln oder gesammelt aktualisieren.

          System- und App-Updates werden nur nach erfolgreicher Signatur-, Größen- und SHA-256-Prüfung übernommen. Das laufende aktive Root-System wird während der Installation nicht überschrieben.

          ### Enthaltene Downloads

          - `msfixit-shopos-rpi4-usb.img.zip` – empfohlene Desktop-Version für Windows und macOS
          - `msfixit-shopos-rpi4-usb.img.zip.sha256` – SHA-256-Prüfsumme des Desktop-Pakets
          - `msfixit-shopos-rpi4-usb.img.xz` – kompakte Version für Linux und fortgeschrittene Nutzung
          - `msfixit-shopos-rpi4-usb.img.xz.sha256` – SHA-256-Prüfsumme der XZ-Version
          - `msfixit-shopos-rpi4-usb.ab-layout` – dokumentiertes A/B-Partitionslayout
          - Update-Artefakte und signierte Manifeste, sobald sie für diese Version veröffentlicht werden

          Eine ausführliche Anleitung mit Hinweisen zu Windows, macOS, Linux, Prüfsummen und Fortschrittsanzeigen befindet sich in `docs/INSTALL_IMAGE.md`.

          ### Wichtiger Hinweis

          Das Update Center ersetzt das erneute Flashen bei normalen Softwareänderungen. Ein physisch defektes Speichermedium oder ein vollständig zerstörtes Dateisystem kann trotzdem einen Austausch beziehungsweise eine Neuinstallation erforderlich machen. Geschäftsdaten und Backups sollten daher dauerhaft auf einem zuverlässigen USB-SSD-Laufwerk und zusätzlich extern gesichert werden.

          ### Enthaltene ShopOS-Funktionen

          Dieses Image enthält unter anderem WooCommerce, das lokale ShopOS Control Center, Kunden- und Servicebereiche, den österreichischen Pilotbetrieb, ALSO-Katalog- und Inhaltsintegration, Office- und Fulfillment-Funktionen, DACH-Compliance-Prüfungen sowie das neue grafische Update Center für System und Apps.

          Partnerprogramm-Aussagen, Logos, Zahlungsarten, Versand-, Steuer- und öffentliche Markteinstellungen bleiben kontrolliert deaktiviert, bis die jeweiligen Nachweise und realen Geschäftsdaten geprüft und freigegeben wurden.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes_file"
            gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes_file"
          fi
