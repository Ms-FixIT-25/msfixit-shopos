name: Build ShopOS image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - tests/**
      - docs/**
      - Makefile
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - tests/**
      - docs/**
      - Makefile
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      device:
        description: Raspberry Pi target
        required: true
        default: rpi4
        type: choice
        options: [rpi4, rpi5]
      storage:
        description: Storage target to build
        required: true
        default: usb
        type: choice
        options: [usb, sd, nvme]

permissions:
  contents: write

concurrency:
  group: shopos-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate article, Office and fulfillment cores
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: shopos-ci-root
          MARIADB_DATABASE: shopos_catalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v7

      - name: Check source syntax
        run: make check

      - name: Install database, PDF and ZIP test clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client php-mysql php-zip php-tcpdf jq unzip

      - name: Test article master
        env:
          MYSQL_PWD: shopos-ci-root
        run: bash tests/test-catalog.sh

      - name: Test protected Office and fulfillment data
        env:
          MYSQL_PWD: shopos-ci-root
        run: sudo env MYSQL_PWD="$MYSQL_PWD" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash tests/test-office.sh

  build:
    name: Build ShopOS image
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v7

      - name: Select target
        shell: bash
        run: |
          device='${{ github.event.inputs.device }}'
          storage='${{ github.event.inputs.storage }}'
          [ -n "$device" ] || device=rpi4
          [ -n "$storage" ] || storage=usb
          if [ "$device" = rpi4 ] && [ "$storage" = nvme ]; then
            echo "Raspberry Pi 4B has no native NVMe target; select USB for an NVMe USB enclosure." >&2
            exit 2
          fi
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          echo "STORAGE=$storage" >> "$GITHUB_ENV"

      - name: Build flash image
        run: bash scripts/build-image.sh "$DEVICE" "$STORAGE"

      - name: Show image checksums
        run: cat artifacts/*.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: msfixit-shopos-${{ env.DEVICE }}-${{ env.STORAGE }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish Raspberry Pi 4B GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DEVICE == 'rpi4' && env.STORAGE == 'usb'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < image/VERSION)"
          tag="v${version}"
          title="Ms. FixIT ShopOS ${version}"
          notes_file="$(mktemp)"

          cat > "$notes_file" <<EOF
          Flash-ready Raspberry Pi 4 Model B USB-SSD image for Ms. FixIT ShopOS.

          Included downloads:
          - compressed Raspberry Pi 4B ShopOS image
          - portable SHA-256 checksum

          This build includes DACH WooCommerce, the permanent Ms. FixIT article master, immutable invoice and delivery-note documents, payment allocation, guarded reminders, ProSaldo handoff packages, shipment/label storage and CUPS print queues.

          Production tax profiles, legal wording, payment providers, shipping prices, carrier contracts/API credentials, Swiss customs workflow and real printers still require deliberate configuration and physical testing. Carrier APIs remain disabled until contract-specific onboarding is completed.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes_file"
            gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes_file"
          fi
