name: Build ShopOS image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - Makefile
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
    paths:
      - image/**
      - scripts/**
      - Makefile
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      storage:
        description: Storage target to build
        required: true
        default: usb
        type: choice
        options:
          - usb
          - sd
          - nvme

permissions:
  contents: write

concurrency:
  group: shopos-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: make check

  build:
    name: Build Raspberry Pi 5 image
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out ShopOS
        uses: actions/checkout@v4

      - name: Select storage target
        shell: bash
        run: |
          storage='${{ github.event.inputs.storage }}'
          if [ -z "$storage" ]; then
            storage=usb
          fi
          echo "STORAGE=$storage" >> "$GITHUB_ENV"

      - name: Build flash image
        run: bash scripts/build-image.sh "$STORAGE"

      - name: Show image checksums
        run: cat artifacts/*.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: msfixit-shopos-rpi5-${{ env.STORAGE }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.STORAGE == 'usb'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < image/VERSION)"
          tag="v${version}"
          title="Ms. FixIT ShopOS ${version}"
          notes_file="$(mktemp)"

          cat > "$notes_file" <<EOF
          Flash-ready Raspberry Pi 5 USB-SSD image for Ms. FixIT ShopOS.

          Included downloads:
          - compressed ShopOS image
          - portable SHA-256 checksum

          The image was built on GitHub's native ARM64 runner. Physical first-boot validation on the target Raspberry Pi is still required before connecting the production domain.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes_file"
            gh release upload "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file"
          fi
