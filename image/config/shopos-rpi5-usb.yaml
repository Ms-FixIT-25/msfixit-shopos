include:
  file: common.yaml

# A Raspberry Pi 5 booting from an SSD through a USB adapter uses the USB
# storage profile. rpi-image-gen v2.6.0 accepts this in layer metadata; the
# build script applies the matching one-line IDP schema compatibility patch.
device:
  layer: rpi5
  storage_type: usb

image:
  name: msfixit-shopos-rpi5-usb
