# ShopOS owns appliance networking through NetworkManager.
# Debian's ifupdown plugin otherwise leaves interfaces declared by legacy
# configuration unmanaged, which can make a present Pi WLAN adapter unusable.
[ifupdown]
managed=true

# Kiosk/appliance networking should remain stable while the display is idle.
# NetworkManager value 2 disables Wi-Fi powersave for created connections.
[connection]
wifi.powersave=2
