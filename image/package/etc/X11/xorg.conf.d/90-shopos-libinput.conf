# ShopOS physical kiosk input. Keep Xorg on the standard libinput path even
# when the appliance session is launched directly from systemd rather than a
# desktop display manager.
Section "InputClass"
    Identifier "ShopOS keyboard"
    MatchIsKeyboard "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "ShopOS pointer"
    MatchIsPointer "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "ShopOS touchscreen"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection
