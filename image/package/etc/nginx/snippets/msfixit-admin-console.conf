location = /admin {
    return 301 /admin/;
}

location /admin/ {
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    alias /usr/share/msfixit-shopos/admin-console/public/;
    index index.php;
    try_files $uri $uri/ /admin/index.php?$query_string;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/msfixit-shopos/admin-console/public/index.php;
        fastcgi_param SCRIPT_NAME /admin/index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
