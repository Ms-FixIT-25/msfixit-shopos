server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /srv/www/wordpress;
    index index.php index.html;

    client_max_body_size 128m;
    server_tokens off;

    location = /shopos-health {
        default_type text/plain;
        alias /run/msfixit-shopos/health.txt;
        add_header Cache-Control "no-store" always;
    }

    include snippets/msfixit-admin-console.conf;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Security-sensitive deny regexes must precede the generic PHP handler.
    # Nginx evaluates regular-expression locations in declaration order and
    # stops at the first matching regex. Keeping these first prevents a PHP file
    # placed under writable WordPress upload/file directories from reaching FPM.
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/msfixit-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_param HTTPS $shopos_fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }
}
