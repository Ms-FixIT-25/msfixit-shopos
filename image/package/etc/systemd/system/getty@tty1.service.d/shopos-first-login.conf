[Service]
# The first-time local setup is intentionally interactive and may remain idle
# while the operator chooses credentials or Wi-Fi. The default systemd service
# start timeout would otherwise kill ExecStartPre after roughly 90 seconds and
# cause getty@tty1 to restart in a loop, repeatedly resetting the console.
TimeoutStartSec=infinity
ExecStartPre=/bin/bash /usr/local/sbin/msfixit-display-keepawake /dev/tty1
ExecStartPre=/bin/bash /usr/local/sbin/msfixit-first-login-init
