# METABEGIN
# X-Env-Layer-Name: msfixit-shopos
# X-Env-Layer-Category: application
# X-Env-Layer-Desc: Minimal Ms. FixIT WooCommerce appliance for Raspberry Pi 5.
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Requires: trixie-minbase
# METAEND
---
mmdebstrap:
  packages:
    - bash
    - ca-certificates
    - curl
    - jq
    - mariadb-client
    - mariadb-server
    - nginx
    - nftables
    - openssl
    - php-bcmath
    - php-cli
    - php-curl
    - php-fpm
    - php-gd
    - php-imagick
    - php-intl
    - php-mbstring
    - php-mysql
    - php-soap
    - php-xml
    - php-zip
    - redis-server
    - rsync
    - sudo
    - tar
    - unzip
    - xz-utils
  customize-hooks:
    - |-
      set -eu
      install -D -m 0644 image/assets/etc/nginx/sites-available/shopos "$1/etc/nginx/sites-available/shopos"
      install -D -m 0644 image/assets/etc/php/8.4/fpm/pool.d/shopos.conf "$1/etc/php/8.4/fpm/pool.d/shopos.conf"
      install -D -m 0644 image/assets/etc/nftables.conf "$1/etc/nftables.conf"
      install -D -m 0644 image/assets/etc/ssh/sshd_config.d/60-shopos.conf "$1/etc/ssh/sshd_config.d/60-shopos.conf"
      install -D -m 0644 image/assets/etc/systemd/system/shopos-firstboot.service "$1/etc/systemd/system/shopos-firstboot.service"
      install -D -m 0644 image/assets/etc/systemd/system/shopos-health.service "$1/etc/systemd/system/shopos-health.service"
      install -D -m 0644 image/assets/etc/systemd/system/shopos-health.timer "$1/etc/systemd/system/shopos-health.timer"
      install -D -m 0644 image/assets/etc/systemd/system/shopos-backup.service "$1/etc/systemd/system/shopos-backup.service"
      install -D -m 0644 image/assets/etc/systemd/system/shopos-backup.timer "$1/etc/systemd/system/shopos-backup.timer"
      install -D -m 0644 image/assets/etc/systemd/system/shopos-wp-cron.service "$1/etc/systemd/system/shopos-wp-cron.service"
      install -D -m 0644 image/assets/etc/systemd/system/shopos-wp-cron.timer "$1/etc/systemd/system/shopos-wp-cron.timer"
      install -D -m 0644 image/assets/etc/systemd/system/cloudflared-shopos.service "$1/etc/systemd/system/cloudflared-shopos.service"
      install -D -m 0755 image/assets/usr/local/sbin/shopos-firstboot "$1/usr/local/sbin/shopos-firstboot"
      install -D -m 0755 image/assets/usr/local/sbin/shopos-setup "$1/usr/local/sbin/shopos-setup"
      install -D -m 0755 image/assets/usr/local/sbin/shopos-health "$1/usr/local/sbin/shopos-health"
      install -D -m 0755 image/assets/usr/local/sbin/shopos-backup "$1/usr/local/sbin/shopos-backup"
      install -D -m 0644 image/assets/var/www/shopos/index.html "$1/var/www/shopos/index.html"
    - |-
      uchroot "$1" bash -euxo pipefail <<'EOCHROOT'
      getent group shopadmin >/dev/null || groupadd --system shopadmin
      id shopadmin >/dev/null 2>&1 || useradd --create-home --shell /bin/bash --groups sudo --password '!' shopadmin
      id cloudflared >/dev/null 2>&1 || useradd --system --home /var/lib/cloudflared --create-home --shell /usr/sbin/nologin cloudflared

      install -d -m 0750 -o root -g root /etc/shopos
      install -d -m 0750 -o root -g root /var/lib/shopos
      install -d -m 0700 -o root -g root /var/backups/shopos
      install -d -m 0755 -o www-data -g www-data /var/www/shopos
      chown -R www-data:www-data /var/www/shopos

      rm -f /etc/nginx/sites-enabled/default
      rm -f /etc/php/8.4/fpm/pool.d/www.conf
      ln -sfn /etc/nginx/sites-available/shopos /etc/nginx/sites-enabled/shopos

      curl -fsSL https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /usr/local/bin/wp
      echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /usr/local/bin/wp' | sha256sum -c -
      chmod 0755 /usr/local/bin/wp

      curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-arm64 -o /usr/local/bin/cloudflared
      echo '405df476437e027fc6d18729a5a77155c0a33a6082aeee60a799a688f3052e66  /usr/local/bin/cloudflared' | sha256sum -c -
      chmod 0755 /usr/local/bin/cloudflared

      printf '%s\n' 'msfixit-shopos' > /etc/hostname
      printf '%s\n' 'ShopOS 0.1.0' > /etc/shopos/version
      EOCHROOT
    - $BDEBSTRAP_HOOKS/enable-units "$1" ssh nginx php8.4-fpm mariadb redis-server nftables shopos-firstboot.service shopos-health.timer shopos-backup.timer shopos-wp-cron.timer
    - $BDEBSTRAP_HOOKS/disable-units "$1" apt-daily.timer apt-daily-upgrade.timer
